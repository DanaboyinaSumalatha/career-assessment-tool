# ============================================================
#  CareerPath Backend - Application Properties
# ============================================================

# Server
server.port=8080
server.servlet.context-path=/

spring.application.name=career-assessment-backend

# ============================================================
# DATABASE — MySQL
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/career_assessment_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=CareerDB@2026

# H2 console disabled (not using H2)
spring.h2.console.enabled=false

# ============================================================
# DATABASE — PostgreSQL (uncomment for production)
# ============================================================
# spring.datasource.url=jdbc:postgresql://localhost:5432/careerpath_db
# spring.datasource.driver-class-name=org.postgresql.Driver
# spring.datasource.username=postgres
# spring.datasource.password=your_password

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# For PostgreSQL: spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ============================================================
# JWT
# ============================================================
# Base64-encoded secret key (min 256 bits for HS256)
app.jwt.secret=Y2FyZWVycGF0aC1zZWNyZXQta2V5LWZvci1qd3QtdG9rZW4tYXV0aGVudGljYXRpb24tMjAyNg==
app.jwt.expiration=86400000
# Admin token expiry: 8 hours
app.jwt.admin-expiration=28800000

# ============================================================
# Admin Credentials  (only this email is permitted as admin)
# ============================================================
app.admin.email=danaboyinamahendra@gmail.com
app.admin.password=Mahi@2005

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:5173,http://localhost:5174

# ============================================================
# Logging
# ============================================================
logging.level.com.careerpath=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG

# ============================================================
# OpenAPI / Swagger
# ============================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
